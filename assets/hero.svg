<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4F46E5"/><stop offset=".5" stop-color="#7C3AED"/><stop offset="1" stop-color="#DB2777"/>
    </linearGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset=".55" stop-color="#F7F7FF"/><stop offset="1" stop-color="#FDF2F8"/>
    </linearGradient>
    <radialGradient id="b1"><stop offset="0" stop-color="#818CF8" stop-opacity=".30"/><stop offset="1" stop-color="#818CF8" stop-opacity="0"/></radialGradient>
    <radialGradient id="b2"><stop offset="0" stop-color="#F472B6" stop-opacity=".24"/><stop offset="1" stop-color="#F472B6" stop-opacity="0"/></radialGradient>
    <radialGradient id="b3"><stop offset="0" stop-color="#C084FC" stop-opacity=".26"/><stop offset="1" stop-color="#C084FC" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#4F46E5" stroke-opacity=".06"/>
    </pattern>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#4F46E5" flood-opacity=".14"/>
    </filter>
    <clipPath id="clip"><rect width="1200" height="380" rx="24"/></clipPath>
  </defs>
  <style>
    @keyframes d1{50%{transform:translate(60px,30px)}}
    @keyframes d2{50%{transform:translate(-70px,-20px)}}
    @keyframes d3{50%{transform:translate(40px,-40px)}}
    @keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
    @keyframes blink{50%{opacity:0}}
    @keyframes pulse{0%{r:5;opacity:1}100%{r:13;opacity:0}}
    .u{opacity:0;animation:up .8s cubic-bezier(.2,.7,.2,1) forwards}
  </style>

  <g clip-path="url(#clip)">
    <rect width="1200" height="380" fill="url(#bg)"/>
    <circle cx="180" cy="60" r="320" fill="url(#b1)" style="animation:d1 14s ease-in-out infinite"/>
    <circle cx="1080" cy="340" r="300" fill="url(#b2)" style="animation:d2 16s ease-in-out infinite"/>
    <circle cx="760" cy="30" r="260" fill="url(#b3)" style="animation:d3 12s ease-in-out infinite"/>
    <rect width="1200" height="380" fill="url(#grid)"/>
  </g>
  <rect x=".5" y=".5" width="1199" height="379" rx="24" fill="none" stroke="#E2E6F3"/>

  <!-- status pill -->
  <g class="u" style="animation-delay:.1s">
    <rect x="72" y="62" width="214" height="34" rx="17" fill="#FFFFFF" stroke="#D9DEF0"/>
    <circle cx="94" cy="79" r="5" fill="#16A34A"/>
    <circle cx="94" cy="79" r="5" fill="none" stroke="#16A34A" stroke-width="2" style="animation:pulse 1.8s ease-out infinite"/>
    <text x="108" y="84" font-size="14" fill="#1E293B" font-weight="600">Open to opportunities</text>
  </g>

  <!-- name -->
  <g class="u" style="animation-delay:.25s">
    <text x="70" y="178" font-size="76" font-weight="800" fill="#0F172A" letter-spacing="-2">Kamran Ahsan</text>
  </g>

  <!-- role -->
  <g class="u" style="animation-delay:.4s">
    <text x="72" y="226" font-size="30" font-weight="700" fill="url(#g)">Full Stack Developer</text>
    <rect x="378" y="203" width="3" height="28" fill="#DB2777" style="animation:blink 1s steps(1) infinite"/>
  </g>

  <!-- tagline -->
  <g class="u" style="animation-delay:.55s">
    <text x="72" y="268" font-size="18" fill="#475569">I build scalable, real-time, high-performance web &amp; mobile apps.</text>
  </g>

  <!-- stack chips -->
  <g class="u" style="animation-delay:.7s" font-size="14" font-weight="600" fill="#1E293B">
    <rect x="72"  y="298" width="84"  height="34" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-opacity=".45"/><text x="114" y="320" text-anchor="middle">React</text>
    <rect x="166" y="298" width="96"  height="34" rx="10" fill="#FFFFFF" stroke="#5B43E9" stroke-opacity=".45"/><text x="214" y="320" text-anchor="middle">Next.js</text>
    <rect x="272" y="298" width="96"  height="34" rx="10" fill="#FFFFFF" stroke="#6B3FEB" stroke-opacity=".45"/><text x="320" y="320" text-anchor="middle">Node.js</text>
    <rect x="378" y="298" width="132" height="34" rx="10" fill="#FFFFFF" stroke="#7C3AED" stroke-opacity=".45"/><text x="444" y="320" text-anchor="middle">React Native</text>
    <rect x="520" y="298" width="112" height="34" rx="10" fill="#FFFFFF" stroke="#DB2777" stroke-opacity=".45"/><text x="576" y="320" text-anchor="middle">TypeScript</text>
  </g>

  <!-- code window -->
  <g class="u" style="animation-delay:.5s">
    <rect x="770" y="70" width="360" height="240" rx="16" fill="#FFFFFF" stroke="#E2E6F3" filter="url(#sh)"/>
    <path d="M786 70h328a16 16 0 0116 16v30H770V86a16 16 0 0116-16z" fill="#F8FAFC"/>
    <circle cx="796" cy="96" r="6" fill="#FF5F57"/><circle cx="816" cy="96" r="6" fill="#FEBC2E"/><circle cx="836" cy="96" r="6" fill="#28C840"/>
    <text x="1104" y="101" font-size="12" fill="#64748B" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">kamran.ts</text>
    <line x1="770" y1="116" x2="1130" y2="116" stroke="#E2E6F3"/>
    <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14.5" fill="#334155">
      <text x="794" y="148"><tspan fill="#7C3AED">const</tspan><tspan> dev </tspan><tspan fill="#DB2777">=</tspan><tspan> {</tspan></text>
      <text x="814" y="174"><tspan fill="#4F46E5">role</tspan><tspan>: </tspan><tspan fill="#059669">"Full Stack"</tspan><tspan>,</tspan></text>
      <text x="814" y="200"><tspan fill="#4F46E5">focus</tspan><tspan>: [</tspan><tspan fill="#059669">"RN"</tspan><tspan>, </tspan><tspan fill="#059669">"Node"</tspan><tspan>],</tspan></text>
      <text x="814" y="226"><tspan fill="#4F46E5">realtime</tspan><tspan>: </tspan><tspan fill="#DB2777">true</tspan><tspan>,</tspan></text>
      <text x="814" y="252"><tspan fill="#4F46E5">shipping</tspan><tspan>: </tspan><tspan fill="#D97706">"always"</tspan><tspan>,</tspan></text>
      <text x="794" y="278">};</text>
      <rect x="814" y="266" width="9" height="16" fill="#7C3AED" style="animation:blink 1s steps(1) infinite"/>
    </g>
  </g>
</svg>
