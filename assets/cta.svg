<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="200" viewBox="0 0 1200 200" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6366F1"/><stop offset=".5" stop-color="#A855F7"/><stop offset="1" stop-color="#EC4899"/></linearGradient>
<radialGradient id="glow" cx="1" cy="0" r="1"><stop offset="0" stop-color="#A855F7" stop-opacity=".25"/><stop offset="1" stop-color="#A855F7" stop-opacity="0"/></radialGradient></defs>
<style>@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}} .u{opacity:0;animation:up .7s ease forwards}</style>
<style>@keyframes sh{from{transform:translateX(-300px)}to{transform:translateX(1500px)}}</style>
<clipPath id="c"><rect width="1200" height="200" rx="24"/></clipPath>
<g clip-path="url(#c)"><rect width="1200" height="200" fill="url(#g)"/>
<rect x="0" y="-50" width="120" height="300" fill="#fff" fill-opacity=".14" transform="skewX(-20)" style="animation:sh 4s ease-in-out infinite"/></g>
<text x="64" y="88" font-size="38" font-weight="800" fill="#fff" letter-spacing="-1">Let's build something great together.</text>
