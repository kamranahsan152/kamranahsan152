name: Update profile cards

on:
  push:
    branches: [main, master]
    paths-ignore: ["assets/cards/**"]
  schedule:
    - cron: "17 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate stats, languages & streak cards
        run: node scripts/generate-cards.mjs
        env:
          GH_USER: ${{ github.repository_owner }}
          GITHUB_TOKEN: ${{ secrets.STATS_TOKEN || github.token }}

      - name: Generate contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            assets/cards/snake.svg?palette=github-dark&color_snake=#EC4899&color_dots=#111729,#3730A3,#6366F1,#A855F7,#EC4899

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/cards
          git diff --cached --quiet || git commit -m "chore: refresh profile cards"
          git push
